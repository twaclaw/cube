[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "magiccube"
description = "Rubik's cube drawings: the 3D view, the net and cycle notation, as SVG"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "magiccube"
