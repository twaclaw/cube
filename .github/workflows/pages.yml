name: build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # cube-py is excluded from the workspace, so --workspace misses it. It
      # is the published Python package, so check it on its own.
      - run: cargo fmt --manifest-path crates/cube-py/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/cube-py/Cargo.toml --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The build tools come from crates.io and npm, never from GitHub release
      # downloads: those have been timing out with 504s, and trunk fetches
      # wasm-bindgen and wasm-opt from them itself when they are not on PATH.
      # trunk takes a wasm-bindgen from PATH only when its version matches the
      # crate's exactly, so that version is read from Cargo.lock. wasm-opt has
      # no recent build on crates.io; the npm package is binaryen's own.
      - name: Tool versions
        id: tools
        run: |
          set -eu
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          test -n "$bindgen"
          echo "trunk=0.22.1" >> "$GITHUB_OUTPUT"
          echo "bindgen=$bindgen" >> "$GITHUB_OUTPUT"
          echo "binaryen=123.0.0" >> "$GITHUB_OUTPUT"
          echo "dir=$HOME/.cube-tools" >> "$GITHUB_OUTPUT"
      - name: Cache the build tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.tools.outputs.dir }}
          key: tools-${{ runner.os }}-trunk${{ steps.tools.outputs.trunk }}-bindgen${{ steps.tools.outputs.bindgen }}-binaryen${{ steps.tools.outputs.binaryen }}
      - name: Install trunk, wasm-bindgen and wasm-opt
        if: steps.tools-cache.outputs.cache-hit != 'true'
        env:
          DIR: ${{ steps.tools.outputs.dir }}
        run: |
          set -eu
          cargo install --locked --root "$DIR" trunk --version "${{ steps.tools.outputs.trunk }}"
          cargo install --locked --root "$DIR" wasm-bindgen-cli --version "${{ steps.tools.outputs.bindgen }}"
          npm install --prefix "$DIR/npm" --no-audit --no-fund "binaryen@${{ steps.tools.outputs.binaryen }}"
      - name: Put the build tools on PATH
        env:
          DIR: ${{ steps.tools.outputs.dir }}
        run: |
          set -eu
          echo "$DIR/bin" >> "$GITHUB_PATH"
          echo "$DIR/npm/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$DIR/bin:$DIR/npm/node_modules/.bin:$PATH"
          trunk --version
          wasm-bindgen --version
          wasm-opt --version

      # Reports the path the site is served from, so the build does not have to
      # guess it. This step cannot switch Pages on: the action's `enablement`
      # input needs a token other than GITHUB_TOKEN, so Pages is turned on once
      # by hand under Settings > Pages, with the source set to GitHub Actions.
      # Until that is done the step fails, and the fallback below is used.
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Build
        run: trunk build --release --public-url "${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/"

      # Release builds are minified, which drops attribute quotes, so match
      # loosely and parse the structured data rather than grepping it.
      - name: Check the metadata survived the build
        run: |
          set -eu
          for needle in 'rel="?canonical' 'og:image' 'og:title' 'twitter:card'; do
            grep -qE "$needle" dist/index.html || { echo "missing: $needle"; exit 1; }
          done
          test -f dist/og.png
          test -f dist/sitemap.xml
          python3 -I - <<'PY'
          import json, re, pathlib, sys
          html = pathlib.Path("dist/index.html").read_text()
          block = re.search(r'ld\+json[^>]*>(.*?)</script>', html, re.S)
          if not block:
              sys.exit("no JSON-LD block in dist/index.html")
          data = json.loads(block.group(1))
          for key in ("@context", "@type", "name", "url", "description"):
              if not data.get(key):
                  sys.exit(f"JSON-LD is missing {key}")
          print("JSON-LD ok:", data["@type"], "-", data["name"])
          PY
          echo "metadata ok"

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: [check, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
